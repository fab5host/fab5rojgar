<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BharatRojgarDesk - Live Govt Jobs, Admit Card & Results</title>
  <style>
    :root { --navy: #0B1F3A; --teal: #0D6E6E; --saffron: #D96B27; --bg: #F1F5F9; --border: #CBD5E1; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, Arial, sans-serif; }
    body { background: var(--bg); color: #0F172A; line-height: 1.5; }
    header { background: var(--navy); color: #fff; padding: 18px; text-align: center; border-bottom: 4px solid var(--saffron); }
    .brand { font-size: 26px; font-weight: 800; cursor: pointer; }
    .brand span { color: #FBBF24; }
    nav { background: #1E293B; display: flex; justify-content: center; flex-wrap: wrap; }
    nav button { background: none; border: none; color: #fff; padding: 12px 16px; font-weight: 700; cursor: pointer; }
    nav button:hover, nav button.active { background: var(--saffron); }
    .search-bar { max-width: 800px; margin: 15px auto; padding: 0 15px; display: flex; gap: 8px; }
    .search-bar input { flex: 1; padding: 11px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    .container { max-width: 1200px; margin: 15px auto; padding: 0 15px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .card h2 { background: var(--navy); color: #fff; padding: 12px; font-size: 16px; }
    .card.teal h2 { background: var(--teal); }
    .card.green h2 { background: #065F46; }
    ul { list-style: none; max-height: 550px; overflow-y: auto; }
    li { padding: 12px; border-bottom: 1px solid #E2E8F0; }
    li a { text-decoration: none; color: #0F172A; font-weight: 700; font-size: 14px; display: block; cursor: pointer; }
    li a:hover { color: var(--teal); text-decoration: underline; }
    .meta { font-size: 11px; color: #64748B; margin-top: 4px; }
    #detail-box { display: none; background: #fff; border: 2px solid var(--navy); border-radius: 10px; padding: 20px; }
    .btn { background: var(--navy); color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; margin-right: 8px; }
    .btn-green { background: #16A34A; }
    .btn-orange { background: var(--saffron); margin-top: 15px; }
    .content-area { margin-top: 15px; padding: 15px; background: #F8FAFC; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
  </style>
</head>
<body>

<header>
  <div class="brand" onclick="showHome()">Bharat<span>Rojgar</span>Desk</div>
  <p style="font-size:13px; color:#CBD5E1;">Daily Auto-Updated Govt Jobs, Admit Card & Results</p>
</header>

<nav>
  <button class="active" onclick="filterTab('ALL', this)">🏠 All Updates</button>
  <button onclick="filterTab('JOBS', this)">🔥 Latest Jobs</button>
  <button onclick="filterTab('ADMIT', this)">🎟️ Admit Cards</button>
  <button onclick="filterTab('RESULT', this)">📊 Results</button>
</nav>

<div class="search-bar">
  <input type="text" id="searchInput" onkeyup="searchJobs()" placeholder="Search SSC, Railway, Police, Army, Haryana, UP, Bihar...">
</div>

<div class="container">
  <div class="grid" id="homeGrid">
    <div class="card" id="boxJobs">
      <h2>🔥 Latest Government Jobs</h2>
      <ul id="listJobs"><li style="padding:20px; text-align:center;">डेटा लोड हो रहा है...</li></ul>
    </div>
    <div class="card teal" id="boxAdmit">
      <h2>🎟️ Admit Cards & Exam Dates</h2>
      <ul id="listAdmit"><li style="padding:20px; text-align:center;">डेटा लोड हो रहा है...</li></ul>
    </div>
    <div class="card green" id="boxResult">
      <h2>📊 Results & Answer Keys</h2>
      <ul id="listResult"><li style="padding:20px; text-align:center;">डेटा लोड हो रहा है...</li></ul>
    </div>
  </div>

  <div id="detail-box">
    <button class="btn" onclick="showHome()">⬅️ Back</button>
    <button class="btn btn-green" onclick="shareWA()">📲 Share on WhatsApp</button>
    <h1 id="dTitle" style="font-size:20px; margin:15px 0; color:var(--navy);"></h1>
    <p id="dLinkShow" style="font-size:12px; color:#1D4ED8; font-weight:bold; word-break:break-all;"></p>
    <div class="content-area" id="dBody"></div>
    <a id="dApply" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-orange">🔗 Open Official Notification / Apply Link</a>
  </div>
</div>

<script>
  let allJobs = [];

  async function init() {
    try {
      const res = await fetch('./jobs.json?v=' + Date.now());
      allJobs = await res.json();
      render();
    } catch (e) {
      document.getElementById('listJobs').innerHTML = '<li style="padding:20px;">कृपया GitHub Actions में जाकर एक बार "Run workflow" चलाएं।</li>';
    }
  }

  function render() {
    const jUl = document.getElementById('listJobs');
    const aUl = document.getElementById('listAdmit');
    const rUl = document.getElementById('listResult');
    jUl.innerHTML = ''; aUl.innerHTML = ''; rUl.innerHTML = '';

    allJobs.forEach((job, i) => {
      const t = job.title.toLowerCase();
      const html = `<li class="j-item" data-t="${t}">
        <a onclick="openJob(${i})">• ${job.title}</a>
        <div class="meta">📅 ${new Date(job.pubDate).toLocaleDateString('hi-IN')}</div>
      </li>`;

      if (t.includes('admit card') || t.includes('hall ticket') || t.includes('exam date')) aUl.innerHTML += html;
      else if (t.includes('result') || t.includes('merit') || t.includes('answer key')) rUl.innerHTML += html;
      else jUl.innerHTML += html;
    });

    const params = new URLSearchParams(window.location.search);
    if (params.has('job') && allJobs[params.get('job')]) openJob(params.get('job'));
  }

  function openJob(i) {
    const job = allJobs[i];
    if (!job) return;
    const url = window.location.origin + window.location.pathname + '?job=' + i;
    history.pushState({}, job.title, url);
    document.getElementById('dTitle').innerText = job.title;
    document.getElementById('dLinkShow').innerText = 'Direct Link: ' + url;
    document.getElementById('dBody').innerHTML = job.description || job.title;
    document.getElementById('dApply').href = job.link;
    document.getElementById('homeGrid').style.display = 'none';
    document.getElementById('detail-box').style.display = 'block';
    window.scrollTo(0, 0);
  }

  function showHome() {
    history.pushState({}, 'Home', window.location.origin + window.location.pathname);
    document.getElementById('detail-box').style.display = 'none';
    document.getElementById('homeGrid').style.display = 'grid';
  }

  function searchJobs() {
    showHome();
    const q = document.getElementById('searchInput').value.toLowerCase();
    document.querySelectorAll('.j-item').forEach(el => {
      el.style.display = el.getAttribute('data-t').includes(q) ? 'block' : 'none';
    });
  }

  function filterTab(cat, btn) {
    showHome();
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('boxJobs').style.display = (cat === 'ALL' || cat === 'JOBS') ? 'block' : 'none';
    document.getElementById('boxAdmit').style.display = (cat === 'ALL' || cat === 'ADMIT') ? 'block' : 'none';
    document.getElementById('boxResult').style.display = (cat === 'ALL' || cat === 'RESULT') ? 'block' : 'none';
  }

  function shareWA() {
    const msg = document.getElementById('dTitle').innerText + '\n' + window.location.href;
    window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(msg), '_blank');
  }

  init();
</script>
</body>
</html>
