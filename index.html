<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">Notification Details – FAB5HOST</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Poppins:wght@500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn-cms-s-8-4.f-static.net/manager/ai_app_builder/v3/assets/minimize_css/index.css?t=css_y254_67285989&amp;w=12633089" />
    <link rel="stylesheet" href="https://cdn-cms-s-8-4.f-static.net/manager/ai_app_builder/v3/assets/css/theme.css?t=css_y254_67285989&amp;w=12633089" />
    <link rel="stylesheet" href="https://cdn-cms-s-8-4.f-static.net/manager/ai_app_builder/v3/assets/css/main.css?t=css_y254_67285989&amp;w=12633089" />
    <link rel="stylesheet" href="https://cdn-cms-s-8-4.f-static.net/manager/ai_app_builder/v3/assets/css/components.css?t=css_y254_67285989&amp;w=12633089" />
    <link rel="stylesheet" href="https://cdn-cms-s-8-4.f-static.net/manager/ai_app_builder/v3/assets/css/layout.css?t=css_y254_67285989&amp;w=12633089" />
    <style>
      .detail-box { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin: 24px 0; border: 1px solid #e5e7eb; }
      .detail-header { border-bottom: 2px solid #f3f4f6; padding-bottom: 16px; margin-bottom: 20px; }
      .detail-title { font-size: 1.6rem; color: #111827; margin: 8px 0; font-family: 'Poppins', sans-serif; }
      .detail-meta { color: #6b7280; font-size: 0.9rem; display: flex; gap: 16px; flex-wrap: wrap; }
      .sarkari-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
      .info-card { border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; }
      .info-card h3 { background: #1e3a8a; color: #fff; padding: 10px 15px; margin: 0; font-size: 1.05rem; }
      .info-card ul { padding: 15px 20px 15px 32px; margin: 0; list-style-type: disc; }
      .info-card li { margin-bottom: 8px; color: #374151; line-height: 1.5; }
      .action-table { width: 100%; border-collapse: collapse; margin-top: 24px; }
      .action-table td { border: 1px solid #d1d5db; padding: 14px; font-weight: 600; }
      .action-table td:first-child { background: #f8fafc; color: #1e3a8a; width: 55%; }
      .action-table td:last-child { text-align: center; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="fab-container">
        <div class="site-header__bar">
          <a aria-label="FAB5HOST home" class="brand" href="index.html">
            <span class="brand__mark"><i class="fa-solid fa-landmark"></i></span>
            <span class="brand__text">
              <span class="brand__name">FAB5<span>HOST</span></span>
              <span class="brand__tag">Your Future, Our Updates</span>
            </span>
          </a>
          <nav class="mainnav">
            <a href="index.html">Home</a>
            <a href="index.html#jobs-section">Latest Jobs</a>
            <a href="index.html#admit-section">Admit Card</a>
            <a href="index.html#results-section">Results</a>
            <a href="index.html#answer-section">Answer Key</a>
          </nav>
        </div>
      </div>
    </header>

    <main class="fab-container">
      <div style="margin-top: 16px;">
        <a href="index.html" class="btn btn--ghost btn--sm"><i class="fa-solid fa-arrow-left"></i> Back to All Updates</a>
      </div>

      <div class="detail-box" id="postContainer">
        <p>Loading notification details...</p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="fab-container">
        <div class="footer-bottom">
          <p>© 2026 FAB5HOST. All rights reserved. Information compiled from official government sources.</p>
        </div>
      </div>
    </footer>

    <script>
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('id');

      fetch('data.json?t=' + new Date().getTime())
        .then(res => res.json())
        .then(data => {
          const post = data.all_posts && data.all_posts[postId];
          const container = document.getElementById('postContainer');

          if (!post) {
            container.innerHTML = `<h2>Post Not Found</h2><p>This update may have expired. <a href="index.html">Go back to Homepage</a>.</p>`;
            return;
          }

          document.getElementById('pageTitle').textContent = `${post.title} – FAB5HOST`;

          const renderList = (items) => (items && items.length ? items.map(i => `<li>${i}</li>`).join('') : '<li>Check Official Notification</li>');

          container.innerHTML = `
            <div class="detail-header">
              <span class="badge badge--cat">${post.department}</span>
              <h1 class="detail-title">${post.title}</h1>
              <div class="detail-meta">
                <span><i class="fa-solid fa-calendar"></i> Post Date: <strong>${post.date}</strong></span>
                <span><i class="fa-solid fa-shield-halved"></i> Source: Official Portal</span>
              </div>
            </div>

            <p style="font-size: 1.05rem; line-height: 1.6; color: #1f2937; background: #f8fafc; padding: 15px; border-left: 4px solid #1e3a8a; border-radius: 4px;">
              <strong>Short Information:</strong> ${post.short_info}
            </p>

            <div class="sarkari-grid">
              <div class="info-card">
                <h3><i class="fa-solid fa-calendar-days"></i> Important Dates</h3>
                <ul>${renderList(post.important_dates)}</ul>
              </div>
              <div class="info-card">
                <h3><i class="fa-solid fa-indian-rupee-sign"></i> Application Fee</h3>
                <ul>${renderList(post.application_fee)}</ul>
              </div>
              <div class="info-card">
                <h3><i class="fa-solid fa-user-clock"></i> Age Limit</h3>
                <ul>${renderList(post.age_limit)}</ul>
              </div>
              <div class="info-card">
                <h3><i class="fa-solid fa-list-check"></i> Vacancy & Eligibility Details</h3>
                <ul>${renderList(post.vacancy_details)}</ul>
              </div>
            </div>

            <table class="action-table">
              <tr>
                <td colspan="2" style="background: #1e3a8a; color: #fff; text-align: center; font-size: 1.1rem;">
                  Some Useful Important Links
                </td>
              </tr>
              <tr>
                <td>Apply Online / Check Official Notification</td>
                <td><a href="${post.official_website}" target="_blank" rel="noopener" class="btn btn--primary btn--sm">Click Here <i class="fa-solid fa-arrow-up-right-from-square"></i></a></td>
              </tr>
              <tr>
                <td>Official Government Portal</td>
                <td><a href="${post.official_website}" target="_blank" rel="noopener" class="btn btn--ghost btn--sm">Official Website</a></td>
              </tr>
              <tr>
                <td>Share Update on WhatsApp</td>
                <td>
                  <button type="button" class="btn btn--sm" style="background:#25D366; color:#fff; border:none;" onclick="window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(document.title + ' - ' + window.location.href))">
                    <i class="fa-brands fa-whatsapp"></i> Share Now
                  </button>
                </td>
              </tr>
            </table>
          `;
        })
        .catch(() => {
          document.getElementById('postContainer').innerHTML = `<p>Error loading details. Please refresh the page.</p>`;
        });
    </script>
  </body>
</html>
