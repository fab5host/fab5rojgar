name: Auto Update FAB5HOST

on:
  schedule:
    # Roz subah 7:30 AM IST (2:00 AM UTC) par chalega
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 google-generativeai

      - name: Run scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py

      - name: Commit and push data.json
        run: |
          git config --global user.name "FAB5HOST Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "Daily auto update" || exit 0
          git push
