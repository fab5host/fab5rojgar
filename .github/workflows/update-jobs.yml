name: Auto Fetch Govt Jobs
on:
  schedule:
    - cron: '0 * * * *' # हर 1 घंटे में अपने आप चलेगा
  workflow_dispatch: # आप खुद भी बटन दबाकर चला सकते हैं

permissions:
  contents: write

jobs:
  fetch-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch Live Feeds
        run: |
          node -e '
          const fs = require("fs");
          async function run() {
            const feeds = [
              "https://www.freejobalert.com/feed/",
              "https://sarkariresult.com.cm/feed/",
              "https://www.jagranjosh.com/rss/josh/government-jobs.xml"
            ];
            let all = [];
            for (const url of feeds) {
              try {
                const res = await fetch(url, { headers: { "User-Agent": "Mozilla/5.0" } });
                const xml = await res.text();
                const items = xml.match(/<item[\s\S]*?<\/item>/g) || [];
                for (const item of items.slice(0, 20)) {
                  const title = (item.match(/<title><!\[CDATA\[([\s\S]*?)\]\]><\/title>/) || item.match(/<title>([\s\S]*?)<\/title>/) || [])[1] || "";
                  const link = (item.match(/<link>([\s\S]*?)<\/link>/) || [])[1] || "";
                  const pubDate = (item.match(/<pubDate>([\s\S]*?)<\/pubDate>/) || [])[1] || new Date().toISOString();
                  const desc = (item.match(/<description><!\[CDATA\[([\s\S]*?)\]\]><\/description>/) || item.match(/<description>([\s\S]*?)<\/description>/) || [])[1] || "";
                  if (title && link) {
                    all.push({ title: title.trim(), link: link.trim(), pubDate: pubDate.trim(), description: desc.trim() });
                  }
                }
              } catch (e) { console.log("Skip:", url); }
            }
            fs.writeFileSync("jobs.json", JSON.stringify(all, null, 2));
            console.log("Saved jobs:", all.length);
          }
          run();
          '
      - name: Commit Updated Jobs
        run: |
          git config user.name "AutoJobBot"
          git config user.email "bot@users.noreply.github.com"
          git add jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update live jobs" && git push)
          
