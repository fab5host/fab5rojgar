name: FAB5HOST Auto Content Engine
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-original-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract Clean Tables & Rewrite Original Posts
        run: |
          node -e '
          const fs = require("fs");

          function makeSlug(str) {
            return str
              .toLowerCase()
              .replace(/freejobalert|sarkari\s*result|sarkariresult/gi, "")
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "")
              .slice(0, 70);
          }

          function sanitizeAndRewrite(rawHtml, title) {
            let html = rawHtml
              .replace(/<script[\s\S]*?<\/script>/gi, "")
              .replace(/<style[\s\S]*?<\/style>/gi, "")
              .replace(/<iframe[\s\S]*?<\/iframe>/gi, "")
              .replace(/<ins[\s\S]*?<\/ins>/gi, "")
              .replace(/<img[^>]*>/gi, "");

            const bodyMatch =
              html.match(/<div[^>]*class=["\x27][^"\x27]*(?:entry-content|post-body|post-content)[^"\x27]*["\x27][^>]*>([\s\S]*?)<\/div>\s*(?:<footer|<div[^>]*class=["\x27][^"\x27]*(?:comments|post-footer|sharedaddy|yarpp|related))/i) ||
              html.match(/<article[^>]*>([\s\S]*?)<\/article>/i);

            let content = bodyMatch ? bodyMatch[1] : "";

            // Remove all third-party portal links; keep ONLY official .gov.in / .nic.in / .pdf links
            content = content.replace(/<a\s+[^>]*href=["\x27]([^"\x27]+)["\x27][^>]*>([\s\S]*?)<\/a>/gi, (m, href, text) => {
              const cleanText = text.replace(/<[^>]+>/g, "").trim();
              const lowerHref = href.toLowerCase();
              const lowerText = cleanText.toLowerCase();

              if (
                lowerHref.includes("freejobalert") ||
                lowerHref.includes("sarkariresult") ||
                lowerText.includes("freejobalert") ||
                lowerText.includes("sarkari result") ||
                lowerText.includes("telegram") ||
                lowerText.includes("whatsapp") ||
                lowerText.includes("download app")
              ) {
                return "";
              }

              const isOfficial =
                lowerHref.includes(".gov.in") ||
                lowerHref.includes(".nic.in") ||
                lowerHref.endsWith(".pdf") ||
                lowerHref.includes("ibps.in") ||
                lowerHref.includes("sbi.co.in") ||
                lowerHref.includes("rrbcdg") ||
                lowerHref.includes("upsconline") ||
                lowerHref.includes("ssc.gov.in") ||
                lowerHref.includes("nta.ac.in");

              if (isOfficial && cleanText) {
                return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="official-table-link">${cleanText}</a>`;
              }
              return cleanText;
            });

            // Strip all inline attributes & third-party brand mentions
            content = content
              .replace(/\s(?:style|class|id|bgcolor|color|width|height|border|cellpadding|cellspacing)=["\x27][^"\x27]*["\x27]/gi, "")
              .replace(/FreeJobAlert\.com|FreeJobAlert|SarkariResult\.com\.cm|Sarkari\s*Result/gi, "FAB5HOST");

            // Remove empty paragraphs or promotional lines
            content = content
              .replace(/<p[^>]*>\s*(?:&nbsp;|\s)*<\/p>/gi, "")
              .replace(/<p[^>]*>[^<]*(?:join our|follow us|download mobile app|read also|more jobs)[^<]*<\/p>/gi, "");

            const intro = `<div class="fab-summary-box"><strong>FAB5HOST Recruitment Desk:</strong> Complete details, important dates, eligibility criteria, and official portal links for <b>${title}</b> are structured below. Always verify final dates from the official notification PDF.</div>`;

            return intro + content;
          }

          async function run() {
            const feeds = [
              "https://www.freejobalert.com/feed/",
              "https://sarkariresult.com.cm/feed/"
            ];
            let all = [];
            const seen = new Set();

            for (const feedUrl of feeds) {
              try {
                const res = await fetch(feedUrl, { headers: { "User-Agent": "Mozilla/5.0" } });
                const xml = await res.text();
                const items = xml.match(/<item[\s\S]*?<\/item>/g) || [];

                for (const item of items.slice(0, 20)) {
                  let title = ((item.match(/<title><!\[CDATA\[([\s\S]*?)\]\]><\/title>/) || item.match(/<title>([\s\S]*?)<\/title>/) || [])[1] || "").trim();
                  const link = ((item.match(/<link>([\s\S]*?)<\/link>/) || [])[1] || "").trim();
                  const pubDate = ((item.match(/<pubDate>([\s\S]*?)<\/pubDate>/) || [])[1] || new Date().toISOString()).trim();

                  title = title.replace(/FreeJobAlert|Sarkari\s*Result/gi, "").trim();
                  if (!title || !link || seen.has(title.toLowerCase())) continue;
                  seen.add(title.toLowerCase());

                  let fullHtml = "";
                  try {
                    const pageRes = await fetch(link, { headers: { "User-Agent": "Mozilla/5.0" } });
                    const pageText = await pageRes.text();
                    fullHtml = sanitizeAndRewrite(pageText, title);
                  } catch (err) {
                    fullHtml = `<div class="fab-summary-box"><strong>${title}</strong> – Official notification details updated on FAB5HOST.</div>`;
                  }

                  all.push({
                    slug: makeSlug(title),
                    title,
                    pubDate,
                    content: fullHtml
                  });
                }
              } catch (e) {
                console.log("Feed error:", feedUrl);
              }
            }

            if (all.length > 0) {
              fs.writeFileSync("jobs.json", JSON.stringify(all, null, 2));
              console.log("Generated clean FAB5HOST pages:", all.length);
            }
          }
          run();
          '
      - name: Commit Clean Pages
        run: |
          git config user.name "FAB5HOST-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add jobs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Publish clean FAB5HOST pages" && git push)
